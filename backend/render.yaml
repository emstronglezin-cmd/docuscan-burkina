services:
  - type: web
    name: docuscan-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run migration:run
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_SSL
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SASPAY_API_KEY
        sync: false
      - key: SASPAY_WEBHOOK_SECRET
        sync: false
      - key: SASPAY_BASE_URL
        value: https://api.saspay.me/api/v1
      - key: SASPAY_DEFAULT_COUNTRY
        value: BF
      - key: SASPAY_DEFAULT_CURRENCY
        value: XOF
      - key: SASPAY_RETURN_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: FCFA_PER_CREDIT
        value: "50"
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: docuscan-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: docuscan-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: docuscan-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: docuscan-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: docuscan-db
          property: database

databases:
  - name: docuscan-db
    plan: free
